[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sc_robust"
dynamic = ["version", "readme"]
description = "A statistically robust pipeline for building cell-cell graphs from single cell RNAseq"
requires-python = ">=3.10,<3.15"
authors = [{ name = "Scott Tyler", email = "scottyler89@gmail.com" }]
license = "AGPL-3.0-only"
license-files = ["LICENSE"]
dependencies = ["numpy", "pandas", "scipy", "matplotlib", "seaborn", "scikit-learn"]

classifiers = [
  "Programming Language :: Python :: 3",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
full = ["anndata>=0.11.4,<0.12; python_version < '3.11'", "anndata>=0.12.19,<0.14; python_version >= '3.11'", "count_split", "networkx", "statsmodels", "torch", "faiss-cpu", "anticor_features>=0.2.7", "igraph", "leidenalg", "pymetis", "dill", "numba", "h5py", "zarr>=2.18.3,<3; python_version < '3.11'", "zarr>=2.18.7,<4,!=3.0.*; python_version >= '3.11'", "joblib", "formulaic>=1.0.2", "formulaic-contrasts>=0.2.0"]
test = ["pytest", "tomli; python_version < '3.11'"]

[project.urls]
Homepage = "https://github.com/scottyler89/sc_robust"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["sc_robust*", "pydeseq2*"]

[tool.setuptools.dynamic]
version = { attr = "sc_robust._version.__version__" }
readme = { file = ["README.md"], content-type = "text/markdown" }

[tool.setuptools.package-data]
sc_robust = [
  "data/pathways/*.gmt",
  "data/ensg_annotations_abbreviated.txt",
]
pydeseq2 = ["LICENSE"]


name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest
          python -m pip install -e .

      - name: Run tests
        run: |
          set -o pipefail
          python -m pytest -q 2>&1 | tee pytest-output.txt

      - name: Publish test failure summary
        if: failure()
        run: |
          echo "### Core pytest failure" >> "$GITHUB_STEP_SUMMARY"
          sed -n "/= FAILURES =/," pytest-output.txt | head -120 | while IFS= read -r line; do echo "::error::$line"; done
          head -80 pytest-output.txt | while IFS= read -r line; do echo "::error::$line"; done
          tail -80 pytest-output.txt | while IFS= read -r line; do echo "::error::$line"; done
          tail -120 pytest-output.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Build package
        run: |
          python -m pip install build
          python -m build


  de:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install resolved DE environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -c constraints-de-ci.txt
          python -m pip install pytest
          python -m pip install -e . -c constraints-de-ci.txt

      - name: Verify PyDESeq2 resolution
        run: python -c 'import pydeseq2; assert pydeseq2.__version__ == "0.5.0"; assert pydeseq2.__source_commit__ == "8d1c39f7bf17aabe105458b02040f8c9770f8637"'

      - name: Run DE tests
        run: |
          set -o pipefail
          python -m pytest -q tests/test_de_design.py tests/test_de_diagnostics.py tests/test_result_provenance.py 2>&1 | tee pytest-output.txt

      - name: Publish DE failure summary
        if: failure()
        run: |
          echo "### DE pytest failure" >> "$GITHUB_STEP_SUMMARY"
          sed -n "/= FAILURES =/," pytest-output.txt | head -120 | while IFS= read -r line; do echo "::error::$line"; done
          head -80 pytest-output.txt | while IFS= read -r line; do echo "::error::$line"; done
          tail -80 pytest-output.txt | while IFS= read -r line; do echo "::error::$line"; done
          tail -120 pytest-output.txt >> "$GITHUB_STEP_SUMMARY"
